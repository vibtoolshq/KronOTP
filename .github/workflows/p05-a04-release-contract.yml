name: P05-A04 Release Contract Qualification
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/registry-smoke.yml'
      - '.github/workflows/p05-a04-release-contract.yml'
      - 'scripts/release/registry_contract.py'
      - 'qualification/p05-a04/**'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install existing release build tooling
        run: python -m pip install --disable-pip-version-check build twine
      - name: Offline release contract fixtures
        run: python qualification/p05-a04/test_release_contract.py
      - name: Nonpublishing candidate artifact build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/registry_contract.py build --bundle "$RUNNER_TEMP/qualification-bundle" > "$RUNNER_TEMP/build-evidence.log"
          cat "$RUNNER_TEMP/build-evidence.log"
          sha="$(sha256sum "$RUNNER_TEMP/qualification-bundle/manifest.json" | cut -d' ' -f1)"
          python scripts/release/registry_contract.py verify --bundle "$RUNNER_TEMP/qualification-bundle" --manifest-sha "$sha"
          echo 'NONPUBLISHING_BUILD_AND_VERIFY_PASS'
