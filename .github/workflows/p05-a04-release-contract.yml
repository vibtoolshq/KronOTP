name: P05-A04 Release Contract Qualification
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/registry-smoke.yml'
      - '.github/workflows/p05-a04-release-contract.yml'
      - 'scripts/release/registry_contract.py'
      - 'scripts/release/requirements-build.lock'
      - 'qualification/p05-a04/**'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install hash-locked release tooling in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r scripts/release/requirements-build.lock
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -c 'from scripts.release.registry_contract import verify_toolchain; verify_toolchain()'
      - name: Offline release contract fixtures
        run: '"$RUNNER_TEMP/release-tools/bin/python" qualification/p05-a04/test_release_contract.py'
      - name: Nonpublishing candidate artifact build
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-tools/bin/python" scripts/release/registry_contract.py build --bundle "$RUNNER_TEMP/qualification-bundle" > "$RUNNER_TEMP/build-evidence.log"
          cat "$RUNNER_TEMP/build-evidence.log"
          sha="$(sha256sum "$RUNNER_TEMP/qualification-bundle/manifest.json" | cut -d' ' -f1)"
          python scripts/release/registry_contract.py verify --bundle "$RUNNER_TEMP/qualification-bundle" --manifest-sha "$sha"
          echo 'NONPUBLISHING_BUILD_AND_VERIFY_PASS'
