name: KronOTP CI

on:
  push:
    paths:
      - 'javascript/**'
      - 'python/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/registry-smoke.yml'
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.filter.outputs.javascript }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            javascript:
              - 'javascript/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/registry-smoke.yml'
            python:
              - 'python/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/registry-smoke.yml'

  javascript:
    name: JavaScript tests
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Test TOTP engine
        run: node tests/test.js

  python:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Test TOTP engine
        env:
          PYTHONPATH: .
        run: python tests/test_kron_otp.py

  required:
    name: Required CI
    # The only stable protection check: always runs on PRs, including docs-only.
    if: always()
    needs: [changes, javascript, python]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce selected engine checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          JAVASCRIPT_CHANGED: ${{ needs.changes.outputs.javascript }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]] || {
            echo "::error::Change detection did not succeed"; exit 1;
          }
          if [[ "$JAVASCRIPT_CHANGED" == "true" ]]; then
            [[ "$JAVASCRIPT_RESULT" == "success" ]] || {
              echo "::error::Required JavaScript tests did not pass"; exit 1;
            }
          else
            [[ "$JAVASCRIPT_RESULT" == "skipped" ]] || {
              echo "::error::Unexpected JavaScript check result"; exit 1;
            }
          fi
          if [[ "$PYTHON_CHANGED" == "true" ]]; then
            [[ "$PYTHON_RESULT" == "success" ]] || {
              echo "::error::Required Python tests did not pass"; exit 1;
            }
          else
            [[ "$PYTHON_RESULT" == "skipped" ]] || {
              echo "::error::Unexpected Python check result"; exit 1;
            }
          fi
          echo "Required CI passed for this change set."
