name: KronOTP Published Package Smoke Tests

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/registry-smoke.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable version to download and test (e.g. 1.0.0)'
        required: true
        type: string

  workflow_call:
    inputs:
      version:
        required: true
        type: string
      manifest_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kronotp-registry-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and validate published version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate selected SemVer
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          MANIFEST_SHA: ${{ inputs.manifest_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          js = json.loads(pathlib.Path("javascript/package.json").read_text(encoding="utf-8"))
          py = tomllib.loads(pathlib.Path("python/pyproject.toml").read_text(encoding="utf-8"))
          if js["name"] != "kron-otp" or py["project"]["name"] != "kron-otp":
              raise SystemExit("Package name must remain kron-otp in both manifests")
          if os.environ["EVENT_NAME"] == "workflow_dispatch" or os.environ.get("MANIFEST_SHA"):
              version = os.environ.get("REQUESTED_VERSION", "").strip()
          else:
              if js["version"] != py["project"]["version"]:
                  raise SystemExit("Cannot choose default: manifest versions differ")
              version = js["version"]

          if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) is None:
              raise SystemExit("Refusing invalid version: expected numeric MAJOR.MINOR.PATCH only")
          if os.environ.get("MANIFEST_SHA"):
              assert os.environ["EVENT_NAME"] == "push" and os.environ["GITHUB_REF"] == "refs/tags/v" + version
              assert version == js["version"] == py["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as result:
              result.write(f"version={version}\n")
          print(f"Selected public npm/PyPI version: {version}")
          PY

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.manifest_sha != ''
        with:
          name: kronotp-release-bundle
          path: ${{ runner.temp }}/kronotp-release-bundle
      - name: Fetch and verify all three public registry artifacts
        shell: bash
        env:
          SMOKE_VERSION: ${{ steps.version.outputs.version }}
          MANIFEST_SHA: ${{ inputs.manifest_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$MANIFEST_SHA" ]]; then
            python scripts/release/registry_contract.py smoke --version "$SMOKE_VERSION" --bundle "$RUNNER_TEMP/kronotp-release-bundle" --manifest-sha "$MANIFEST_SHA" --destination "$RUNNER_TEMP/verified-registry"
          else
            python scripts/release/registry_contract.py smoke --version "$SMOKE_VERSION" --destination "$RUNNER_TEMP/verified-registry"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kronotp-verified-registry
          path: ${{ runner.temp }}/verified-registry/*
          if-no-files-found: error
          retention-days: 3

  npm:
    name: npm - download, install, verify requested version
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kronotp-verified-registry
          path: ${{ runner.temp }}/verified-registry

      - name: Install downloaded npm release in clean consumer environment
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/npm-consumer" \
            "$RUNNER_TEMP/verified-registry/kron-otp-$SMOKE_VERSION.tgz" \
            --registry=https://registry.npmjs.org \
            --cache "$RUNNER_TEMP/npm-cache" \
            --no-save --ignore-scripts --no-audit --no-fund

      - name: Test installed npm release
        shell: bash
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const packageDir = path.join(process.env.RUNNER_TEMP, 'npm-consumer', 'node_modules', 'kron-otp');
          const KronOTP = require(packageDir);
          const manifest = require(path.join(packageDir, 'package.json'));
          assert.equal(manifest.name, 'kron-otp');
          assert.equal(manifest.version, process.env.SMOKE_VERSION);

          // 160-bit public RFC example key; never a live account secret.
          const secret = 'GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ';
          const token = KronOTP.generate(secret);
          assert.match(token, /^[0-9]{6}$/);
          assert.equal(KronOTP.verify(secret, token), true);
          assert.equal(KronOTP.verify('gezd gnbv gy3t qojq gezd gnbv gy3t qojq', token), true);
          assert.equal(KronOTP.verify(secret, 'invalid'), false);
          assert.equal(KronOTP.verify(secret, '12345'), false);
          assert.throws(() => KronOTP.generate('not-base32!'), TypeError);
          console.log('Published npm kron-otp@' + process.env.SMOKE_VERSION + ': smoke tests PASS');
          JS

      - name: Run original JavaScript source tests
        shell: bash
        run: |
          npm ci --prefix javascript --ignore-scripts --no-audit --no-fund
          node javascript/tests/test.js

  pypi:
    name: PyPI - download, install, verify requested version
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kronotp-verified-registry
          path: ${{ runner.temp }}/verified-registry

      - name: Install downloaded wheel in isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pypi-consumer"
          "$RUNNER_TEMP/pypi-consumer/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            --no-cache-dir \
            "$RUNNER_TEMP/verified-registry/kron_otp-$SMOKE_VERSION-py3-none-any.whl"

      - name: Test installed PyPI release
        shell: bash
        run: |
          "$RUNNER_TEMP/pypi-consumer/bin/python" -I <<'PY'
          import importlib.metadata
          import os
          import re
          from kron_otp import KronOTP

          assert importlib.metadata.version("kron-otp") == os.environ["SMOKE_VERSION"]
          secret = "GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ"
          token = KronOTP.generate(secret)
          assert re.fullmatch(r"[0-9]{6}", token)
          assert KronOTP.verify(secret, token)
          assert KronOTP.verify("gezd gnbv gy3t qojq gezd gnbv gy3t qojq", token)
          assert not KronOTP.verify(secret, "invalid")
          assert not KronOTP.verify(secret, "12345")
          assert not KronOTP.verify("not-base32!", "123456")
          try:
              KronOTP.generate("JBSWY3DPEHPK3PXP")
          except ValueError:
              pass
          else:
              raise AssertionError("Short Base32 secret should be rejected")
          print("Published PyPI kron-otp==" + os.environ["SMOKE_VERSION"] + ": smoke tests PASS")
          PY

      - name: Run original Python source tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'pyotp>=2.12,<3'
          cd python
          python -m unittest discover -s tests -v
