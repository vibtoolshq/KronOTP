name: KronOTP Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'javascript/package.json'
      - 'javascript/package-lock.json'
      - 'javascript/README.md'
      - 'javascript/LICENSE'
      - 'scripts/release/requirements-build.lock'
      - 'scripts/release/registry_contract.py'
      - 'python/pyproject.toml'
      - 'python/README.md'
      - 'python/LICENSE'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kronotp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify release and both packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      manifest_sha: ${{ steps.bundle.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'
          package-manager-cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12.16'

      - name: Verify tag, package versions, and release files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo "::error::Release tag reruns are not allowed"; exit 1; }
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Expected a stable version tag such as v1.0.0"; exit 1;
            }
            git fetch origin main --no-tags
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Release tag must point to a commit on main"; exit 1;
            }
            [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || {
              echo "::error::Release tag must point at the current main HEAD"; exit 1;
            }
          fi
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          js = json.loads(pathlib.Path("javascript/package.json").read_text())
          py = tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())
          version = js["version"]
          assert js["name"] == py["project"]["name"] == "kron-otp"
          assert version == py["project"]["version"], "Package versions differ"
          assert not js.get("private", False), "npm publishing disabled by private=true"
          assert js["scripts"]["test"] == "node tests/test.js", "npm test is not active"
          assert js["dependencies"]["otpauth"], "Missing npm dependency"
          assert "pyotp" in str(py["project"]["dependencies"]), "Missing PyOTP dependency"
          for filename in ("LICENSE", "javascript/LICENSE", "python/LICENSE",
                           "javascript/README.md", "python/README.md"):
              assert pathlib.Path(filename).stat().st_size > 0, filename + " is empty"
          if os.environ["GITHUB_EVENT_NAME"] == "push" and os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Tag and package version mismatch"
          print("Version and release metadata verified:", version)
          PY

      - name: Install Node.js dependencies (locked)
        working-directory: javascript
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test JavaScript engine
        working-directory: javascript
        run: npm test

      - name: Install hash-locked release tooling in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r scripts/release/requirements-build.lock
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -c 'from scripts.release.registry_contract import verify_toolchain; verify_toolchain()'
      - name: Install declared runtime dependencies in separate source venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/source-env"
          python - <<'PY'
          import pathlib, tomllib, subprocess, os
          deps=tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())["project"]["dependencies"]
          subprocess.run([os.environ["RUNNER_TEMP"]+"/source-env/bin/python","-m","pip","--isolated","install","--index-url","https://pypi.org/simple","--only-binary=:all:",*deps],check=True)
          PY
          "$RUNNER_TEMP/source-env/bin/python" -m pip check

      - name: Test Python engine
        working-directory: python
        run: '"$RUNNER_TEMP/source-env/bin/python" -m unittest discover -s tests -v'

      - name: Build immutable release bundle
        id: bundle
        run: '"$RUNNER_TEMP/release-tools/bin/python" scripts/release/registry_contract.py build --bundle "$RUNNER_TEMP/kronotp-release-bundle"'

      - name: Smoke exact local wheel
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/local-wheel"
          "$RUNNER_TEMP/local-wheel/bin/python" -m pip install "$RUNNER_TEMP/kronotp-release-bundle/kron_otp-$RELEASE_VERSION-py3-none-any.whl"
          "$RUNNER_TEMP/local-wheel/bin/python" -I -c 'from kron_otp import KronOTP; s="GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ"; t=KronOTP.generate(s); assert len(t)==6 and KronOTP.verify(s,t)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kronotp-release-bundle
          path: ${{ runner.temp }}/kronotp-release-bundle/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  preflight:
    needs: validate
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kronotp-release-bundle
          path: ${{ runner.temp }}/kronotp-release-bundle
      - name: Verify same-run artifact bundle and current main
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "refs/tags/v$RELEASE_VERSION" ]]
          git fetch origin main --no-tags
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          python scripts/release/registry_contract.py publish-verify --main-sha "$(git rev-parse FETCH_HEAD)" --bundle "$RUNNER_TEMP/kronotp-release-bundle" --manifest-sha "$MANIFEST_SHA" --version "$RELEASE_VERSION"
      - name: Require all three registry artifacts absent
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
        run: python scripts/release/registry_contract.py preflight --bundle "$RUNNER_TEMP/kronotp-release-bundle" --manifest-sha "$MANIFEST_SHA" --version "$RELEASE_VERSION"

  npm:
    name: Publish npm
    needs: [validate, preflight]
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kronotp-release-bundle
          path: ${{ runner.temp }}/kronotp-release-bundle
      - name: Verify same-run artifact bundle and current main
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "refs/tags/v$RELEASE_VERSION" ]]
          git fetch origin main --no-tags
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          python scripts/release/registry_contract.py publish-verify --main-sha "$(git rev-parse FETCH_HEAD)" --bundle "$RUNNER_TEMP/kronotp-release-bundle" --manifest-sha "$MANIFEST_SHA" --version "$RELEASE_VERSION"
      - name: Publish exact validated npm tarball
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm publish "$RUNNER_TEMP/kronotp-release-bundle/kron-otp-$RELEASE_VERSION.tgz" --ignore-scripts --access public --registry=https://registry.npmjs.org --fetch-retries=0

  pypi:
    name: Publish PyPI
    needs: [validate, preflight]
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kronotp-release-bundle
          path: ${{ runner.temp }}/kronotp-release-bundle
      - name: Install hash-locked release tooling in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r scripts/release/requirements-build.lock
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -c 'from scripts.release.registry_contract import verify_toolchain; verify_toolchain()'
      - name: Verify same-run artifact bundle and current main
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "refs/tags/v$RELEASE_VERSION" ]]
          git fetch origin main --no-tags
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          python scripts/release/registry_contract.py publish-verify --main-sha "$(git rev-parse FETCH_HEAD)" --bundle "$RUNNER_TEMP/kronotp-release-bundle" --manifest-sha "$MANIFEST_SHA" --version "$RELEASE_VERSION"
      - name: Publish exact validated Python distributions
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TWINE_PASSWORD"
          # Twine upload has a built-in 5xx retry loop. Limit each file to one attempt.
          "$RUNNER_TEMP/release-tools/bin/python" - "$RUNNER_TEMP/kronotp-release-bundle/kron_otp-$RELEASE_VERSION-py3-none-any.whl" "$RUNNER_TEMP/kronotp-release-bundle/kron_otp-$RELEASE_VERSION.tar.gz" <<'PY'
          # BEGIN SINGLE_ATTEMPT_TWINE
          import inspect
          import sys
          from requests.adapters import HTTPAdapter
          from twine.cli import dispatch
          from twine.repository import Repository
          original = Repository.upload
          if "max_redirects" not in inspect.signature(original).parameters:
              raise RuntimeError("Unsupported Twine upload contract")
          def single_attempt(self, package, max_redirects=1):
              self.session.mount("https://", HTTPAdapter(max_retries=0))
              return original(self, package, max_redirects=1)
          Repository.upload = single_attempt
          sys.exit(dispatch(["upload", "--non-interactive", "--repository-url",
                             "https://upload.pypi.org/legacy/", *sys.argv[1:]]))
          # END SINGLE_ATTEMPT_TWINE
          PY

  reconcile:
    needs: [validate, preflight, npm, pypi]
    if: always() && github.event_name == 'push' && github.ref_type == 'tag' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kronotp-release-bundle
          path: ${{ runner.temp }}/kronotp-release-bundle
      - name: Reconcile actual registry bytes after terminal publisher outcomes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          PYPI_RESULT: ${{ needs.pypi.result }}
        run: python scripts/release/registry_contract.py reconcile --bundle "$RUNNER_TEMP/kronotp-release-bundle" --manifest-sha "$MANIFEST_SHA" --version "$RELEASE_VERSION" --preflight-result "$PREFLIGHT_RESULT" --npm-result "$NPM_RESULT" --pypi-result "$PYPI_RESULT"

  smoke:
    needs: [validate, reconcile]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.reconcile.result == 'success'
    uses: ./.github/workflows/registry-smoke.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      manifest_sha: ${{ needs.validate.outputs.manifest_sha }}
