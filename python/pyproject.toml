[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kron-otp"
version = "1.0.0"
description = "Python TOTP engine for the KronOTP monorepo (implementation pending)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyotp>=2.10,<3",
]

[tool.setuptools]
py-modules = ["kron_otp"]

[tool.setuptools.package-dir]
"" = "src"
